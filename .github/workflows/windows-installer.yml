# Builds what players download: DAORecomp.exe (the launcher with the installer in it)
# and, around it, the Linux AppImage (DAORecomp-x86_64.AppImage, which runs it with Proton).
# Run it from the Actions tab (both are artifacts of the run), or push a version tag
# to publish it on a release, as the launcher's update check reads them: vX.Y.Z for a
# release, vX.Y.Z-dev.N for a dev release (a test build on the way to vX.Y.Z, offered
# only to launchers on the dev update channel).
name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Read-only, but for the publish job: the build runs code it downloads.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # DAORecomp.exe: the launcher with its Install view, carrying the installer
      # (built first). Building it accepts the Microsoft build tools license for
      # their download, as install.py --accept-msvc-license does.
      - name: Build DAORecomp.exe
        run: python scripts/build_setup_exe.py
      # Launchers up to v0.5.1 update with the asset named DAORecomp-Installer.exe:
      # the same exe under that name.
      - name: Name it for older launchers
        shell: bash
        run: cp dist/DAORecomp.exe dist/DAORecomp-Installer.exe
      - uses: actions/upload-artifact@v5
        with:
          name: DAORecomp
          path: |
            dist/DAORecomp.exe
            dist/DAORecomp-Installer.exe

  # The AppImage around that same exe (its tools are pinned downloads, run without FUSE).
  appimage:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: DAORecomp
          path: dist
      - name: Build the AppImage
        run: python3 scripts/build_appimage.py dist/DAORecomp.exe dist/DAORecomp-x86_64.AppImage
      - uses: actions/upload-artifact@v5
        with:
          name: DAORecomp-AppImage
          path: dist/DAORecomp-x86_64.AppImage

  publish:
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: DAORecomp
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: DAORecomp-AppImage
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # (Through the environment: a tag's name isn't pasted into the script.)
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Pre-releases: v0.x, and any tag but a plain vX.Y.Z (dev releases, and other
        # suffixes the launcher doesn't read).
        run: |
          flags=""
          [[ "$TAG" == v0.* || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && flags="--prerelease"
          gh release create "$TAG" dist/DAORecomp.exe dist/DAORecomp-Installer.exe \
            dist/DAORecomp-x86_64.AppImage --repo "$REPO" \
            --generate-notes $flags
